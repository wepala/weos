name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # web/dist is not checked in; //go:embed all:dist requires it to exist,
  # so every Go job downloads the SPA built here (mirrors the Dockerfile).
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/admin/package-lock.json

      - name: Build admin SPA
        working-directory: web/admin
        run: |
          npm ci
          npx nuxt generate

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: web/admin/.output/public

  build:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download admin SPA
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build
        run: go build -o bin/weos ./cmd/weos

  test:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download admin SPA
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.out
          flags: unittests
          name: codecov-umbrella

  lint:
    runs-on: ubuntu-latest
    needs: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Download admin SPA
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: web/dist

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
